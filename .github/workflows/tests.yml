name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples benchmark
      - name: Test
        run: python -m pytest --cov=agent_consistency --cov-report=term-missing
      - name: Secret guard
        run: scripts/check_no_secrets.sh

  microsoft-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Microsoft extra
        run: python -m pip install -U pip && python -m pip install -e ".[test,microsoft]"
      - name: Live Microsoft Agent Framework test
        run: python -m pytest tests/integration/test_microsoft_agent_framework_live.py

  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check_commit_hygiene.sh "origin/${{ github.base_ref }}..HEAD"
          else
            scripts/check_commit_hygiene.sh "${{ github.event.before }}..${{ github.sha }}"
          fi
