name: false-success scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  false-success-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e .
      - name: Scan source
        run: agent-consistency scan . --fail-on high
