[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-consistency"
version = "0.1.0"
description = "Consistency receipts for multi-agent workflows: state snapshots, handoff packets, outcome checks, and run diffs."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Karim Baidar - karimbaidar@yahoo.com" }
]
keywords = [
  "agents",
  "multi-agent",
  "workflow",
  "consistency",
  "guardrails",
  "durable-functions",
  "observability"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "twine>=5.1",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.9"
packages = ["agent_consistency"]
ignore_missing_imports = true
warn_unused_ignores = true
