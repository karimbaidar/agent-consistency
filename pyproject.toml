[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-consistency"
version = "0.3.0"
description = "Reliability layer for AI agent workflows: validate state, handoffs, and outcomes before agents continue."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Karim Baidar", email = "karimbaidar@yahoo.com" }
]
keywords = [
  "ai-agents",
  "llm",
  "multi-agent",
  "workflow",
  "guardrails",
  "observability",
  "reliability",
  "handoff",
  "outcome-verification",
  "agentic-ai"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/karimbaidar/agent-consistency"
Repository = "https://github.com/karimbaidar/agent-consistency"
Issues = "https://github.com/karimbaidar/agent-consistency/issues"
Demo = "https://karimbaidar.github.io/agent-consistency-refund-demo/"

[project.scripts]
agent-consistency = "agent_consistency.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "twine>=5.1",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]
otel = [
  "opentelemetry-api>=1.25",
]
postgres = [
  "psycopg[binary]>=3.2",
]
microsoft = [
  "agent-framework>=1.9.0; python_version >= '3.10'",
]
native-microsoft = [
  "agent-framework>=1.9.0; python_version >= '3.10'",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_consistency = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "performance: smoke tests with generous timing thresholds",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.9"
packages = ["agent_consistency"]
ignore_missing_imports = true
warn_unused_ignores = true
